<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Security Roadmap 2026–27 — Defensive learning path</title>
  <desc id="desc">A dark navy cyber-themed hero banner with a luminous shield, circuit traces, and a learning path from foundations through security operations and engineering to governance and resilience.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset=".52" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#10102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".52" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d43"/>
      <stop offset="1" stop-color="#171437"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7892b8" stroke-opacity=".10" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#8ba9d5" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1440" height="520" rx="30" fill="url(#background)"/>
  <rect width="1440" height="520" rx="30" fill="url(#grid)"/>
  <ellipse cx="1125" cy="240" rx="330" ry="290" fill="url(#aura)"/>
  <path d="M30 30H1410V490H30Z" fill="none" stroke="#7892b8" stroke-opacity=".16" stroke-width="2" rx="26"/>

  <!-- Circuit traces -->
  <g fill="none" stroke="#22d3ee" stroke-opacity=".42" stroke-width="2">
    <path d="M880 92h95l28 28h80"/><path d="M920 132h72l22 22h54"/>
    <path d="M910 390h78l30-30h86"/><path d="M870 428h120l24-24h90"/>
    <path d="M1292 145h58v-42h55"/><path d="M1280 365h72v44h54"/>
  </g>
  <g fill="#67e8f9" filter="url(#glow)">
    <circle cx="1083" cy="120" r="4"/><circle cx="1068" cy="154" r="4"/>
    <circle cx="1104" cy="360" r="4"/><circle cx="1104" cy="404" r="4"/>
    <circle cx="1405" cy="103" r="4"/><circle cx="1406" cy="409" r="4"/>
  </g>

  <!-- Hero copy -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="82" y="66" width="238" height="34" rx="17" fill="#0c2232" stroke="#155e75"/>
    <circle cx="102" cy="83" r="5" fill="#34d399" filter="url(#glow)"/>
    <text x="118" y="89" fill="#a5f3fc" font-size="13" font-weight="700" letter-spacing="2">DEFENSIVE LEARNING · 2026–27</text>
    <text x="80" y="168" fill="#f1f5f9" font-size="49" font-weight="800" letter-spacing="1">CYBER SECURITY</text>
    <text x="80" y="226" fill="#f1f5f9" font-size="49" font-weight="800" letter-spacing="1">ROADMAP</text>
    <rect x="82" y="250" width="108" height="4" rx="2" fill="url(#accent)"/>
    <text x="82" y="292" fill="#b9c8dc" font-size="20">From first alert to resilient enterprise defense</text>
    <text x="82" y="336" fill="#d5e2f5" font-size="13" font-weight="700" letter-spacing="1.5">DETECT WITH CONTEXT</text>
    <circle cx="260" cy="331" r="3" fill="#34d399"/>
    <text x="278" y="336" fill="#d5e2f5" font-size="13" font-weight="700" letter-spacing="1.5">RESPOND WITH DISCIPLINE</text>
    <circle cx="501" cy="331" r="3" fill="#a78bfa"/>
    <text x="519" y="336" fill="#d5e2f5" font-size="13" font-weight="700" letter-spacing="1.5">LEAD WITH EVIDENCE</text>
  </g>

  <!-- Shield emblem -->
  <circle cx="1170" cy="246" r="164" fill="#22d3ee" fill-opacity=".12" filter="url(#softGlow)"/>
  <path d="M1170 83 1293 130v91c0 91-50 150-123 190-73-40-123-99-123-190v-91Z" fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
  <path d="M1170 106 1270 144v76c0 72-38 122-100 159-62-37-100-87-100-159v-76Z" fill="none" stroke="#a5f3fc" stroke-opacity=".3" stroke-width="2"/>
  <path d="m1127 247 29 29 61-69" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="1170" cy="246" r="80" fill="none" stroke="#67e8f9" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="3 9"/>

  <!-- Learning path -->
  <path d="M126 430H1310" fill="none" stroke="#17263c" stroke-width="8" stroke-linecap="round"/>
  <path d="M126 430H1310" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g><circle cx="150" cy="430" r="11" fill="#07111f" stroke="#22d3ee" stroke-width="4"/><text x="150" y="466" fill="#a5f3fc" font-size="13" font-weight="700">FOUNDATIONS</text><text x="150" y="485" fill="#8294ad" font-size="11">01–10</text></g>
    <g><circle cx="500" cy="430" r="11" fill="#07111f" stroke="#34d399" stroke-width="4"/><text x="500" y="466" fill="#a7f3d0" font-size="13" font-weight="700">SOC &amp; ENGINEERING</text><text x="500" y="485" fill="#8294ad" font-size="11">11–22</text></g>
    <g><circle cx="850" cy="430" r="11" fill="#07111f" stroke="#a78bfa" stroke-width="4"/><text x="850" y="466" fill="#ddd6fe" font-size="13" font-weight="700">ADVANCED DEFENSE</text><text x="850" y="485" fill="#8294ad" font-size="11">23–38</text></g>
    <g><circle cx="1240" cy="430" r="11" fill="#07111f" stroke="#fbbf24" stroke-width="4"/><text x="1240" y="466" fill="#fde68a" font-size="13" font-weight="700">GOVERNANCE &amp; RESILIENCE</text><text x="1240" y="485" fill="#8294ad" font-size="11">OUTCOME</text></g>
  </g>
</svg>
